name: Build Custom RustDesk Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: rustdesk/rustdesk-builder:latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject Custom Server Configuration into Source
        run: |
          # Patch default rendezvous servers
          sed -i 's/pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[/pub const RENDEZVOUS_SERVERS: \&\[\&str\] = \&\["${{ secrets.RENDEZVOUS_SERVER }}", /g' libs/hbb_common/src/config.rs
          
          # Patch public key
          sed -i 's/pub const RS_PUB_KEY: &str = "";/pub const RS_PUB_KEY: \&str = "${{ secrets.PUB_KEY }}";/g' libs/hbb_common/src/config.rs

          echo "Verifying patch in config.rs:"
          grep -n "RENDEZVOUS_SERVERS" libs/hbb_common/src/config.rs || true
          grep -n "RS_PUB_KEY" libs/hbb_common/src/config.rs || true

      - name: Build Android ARM64 Release APK
        run: |
          # Build Flutter & native librustdesk.so inside official container
          cd flutter
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload Native Pre-Configured APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-arm64
          path: flutter/build/app/outputs/flutter-apk/*arm64-v8a-release.apk
