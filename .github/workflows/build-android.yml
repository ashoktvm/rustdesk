name: Build Pre-Configured Android APK

on:
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool wget jq zip unzip

      - name: Download Official RustDesk Release APK
        run: |
          RELEASE_JSON=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest)
          APK_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("arm64-v8a.apk$")) | .browser_download_url' | head -n 1)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            APK_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test(".apk$")) | .browser_download_url' | head -n 1)
          fi
          echo "Downloading $APK_URL"
          wget -q -O rustdesk-official.apk "$APK_URL"

      - name: Inject Pre-Configuration via Direct Zip Patching
        run: |
          # Create working folder
          mkdir -p patch_files/assets/flutter_assets/assets
          mkdir -p patch_files/assets/flutter_assets/cfg
          mkdir -p patch_files/assets

          # 1. Config format A (TOML with options table)
          cat << 'EOF' > patch_files/assets/flutter_assets/assets/config.toml
          [options]
          custom-rendezvous-server = '${{ secrets.RENDEZVOUS_SERVER }}'
          relay-server = '${{ secrets.RELAY_SERVER }}'
          api-server = '${{ secrets.API_SERVER }}'
          key = '${{ secrets.PUB_KEY }}'
          EOF

          # 2. Config format B (TOML flat)
          cat << 'EOF' > patch_files/assets/flutter_assets/assets/RustDesk2.toml
          custom-rendezvous-server = '${{ secrets.RENDEZVOUS_SERVER }}'
          relay-server = '${{ secrets.RELAY_SERVER }}'
          api-server = '${{ secrets.API_SERVER }}'
          key = '${{ secrets.PUB_KEY }}'
          EOF

          # 3. Config format C (JSON config)
          cat << 'EOF' > patch_files/assets/flutter_assets/assets/config.json
          {
            "custom-rendezvous-server": "${{ secrets.RENDEZVOUS_SERVER }}",
            "relay-server": "${{ secrets.RELAY_SERVER }}",
            "api-server": "${{ secrets.API_SERVER }}",
            "key": "${{ secrets.PUB_KEY }}"
          }
          EOF

          # Duplicate into flutter_assets/cfg and root assets
          cp patch_files/assets/flutter_assets/assets/config.toml patch_files/assets/config.toml
          cp patch_files/assets/flutter_assets/assets/config.json patch_files/assets/config.json
          cp patch_files/assets/flutter_assets/assets/config.json patch_files/assets/flutter_assets/cfg/default.json

          # Inject directly into APK without breaking binary structures
          cd patch_files
          zip -u ../rustdesk-official.apk assets/flutter_assets/assets/config.toml
          zip -u ../rustdesk-official.apk assets/flutter_assets/assets/RustDesk2.toml
          zip -u ../rustdesk-official.apk assets/flutter_assets/assets/config.json
          zip -u ../rustdesk-official.apk assets/flutter_assets/cfg/default.json
          zip -u ../rustdesk-official.apk assets/config.toml
          zip -u ../rustdesk-official.apk assets/config.json
          cd ..

      - name: Strip Old Signatures and Re-align
        run: |
          # Strip original signature metadata to prevent signature verification failure
          zip -d rustdesk-official.apk 'META-INF/*' || true
          
          # Zipalign the modified APK
          zipalign -v -p 4 rustdesk-official.apk rustdesk-aligned.apk

      - name: Sign APK with Release Certificate
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass ashokdesk123 \
            -keypass ashokdesk123 \
            -alias ashokdesk \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RustDesk Client, OU=Remote, O=AshokTVM, L=Trivandrum, ST=Kerala, C=IN"

          apksigner sign \
            --ks release.keystore \
            --ks-pass pass:ashokdesk123 \
            --ks-key-alias ashokdesk \
            --key-pass pass:ashokdesk123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out rustdesk-ashoktvm.apk \
            rustdesk-aligned.apk

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ashoktvm-arm64
          path: rustdesk-ashoktvm.apk
