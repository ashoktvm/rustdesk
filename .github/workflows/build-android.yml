name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android NDK & Cargo-NDK
        run: |
          cargo install cargo-ndk
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Inject Custom Server Config & Gradle Flags
        working-directory: flutter
        run: |
          # Opt out of incompatible AGP 9 DSL
          echo "android.newDsl=false" >> android/gradle.properties

          # Inject custom server configurations
          python3 -c "
          pub_key = '${{ secrets.PUB_KEY }}'
          rendezvous = '${{ secrets.RENDEZVOUS_SERVER }}'
          relay = '${{ secrets.RELAY_SERVER }}'
          api = '${{ secrets.API_SERVER }}'

          config_content = f'''
          RENDEZVOUS_SERVER={rendezvous}
          RS_PUB_KEY={pub_key}
          RELAY_SERVER={relay}
          API_SERVER={api}
          '''
          with open('.env', 'w') as f:
              f.write(config_content.strip())
          "

      - name: Build APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-android-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
