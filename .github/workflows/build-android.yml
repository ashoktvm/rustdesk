name: Build Pre-Configured Android APK

on:
  workflow_dispatch:

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner apktool wget jq

      - name: Download Latest Official RustDesk Android APK
        run: |
          APK_URL=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.assets[] | select(.name | endswith("-arm64-v8a.apk")) | .browser_download_url' | head -n 1)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            APK_URL=$(curl -s https://api.github.com/repos/rustdesk/rustdesk/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          fi
          echo "Downloading $APK_URL"
          wget -q -O rustdesk-official.apk "$APK_URL"

      - name: Decompile APK
        run: |
          apktool d -f -r rustdesk-official.apk -o apk_unpacked

      - name: Inject Custom Server Config into Flutter Assets
        run: |
          # RustDesk reads configuration from assets/flutter_assets/assets/config.toml
          TARGET_DIR="apk_unpacked/assets/flutter_assets/assets"
          mkdir -p "$TARGET_DIR"

          cat << 'EOF' > "$TARGET_DIR/config.toml"
          custom-rendezvous-server = "${{ secrets.RENDEZVOUS_SERVER }}"
          relay-server = "${{ secrets.RELAY_SERVER }}"
          api-server = "${{ secrets.API_SERVER }}"
          key = "${{ secrets.PUB_KEY }}"
          EOF

          echo "Injected config.toml:"
          cat "$TARGET_DIR/config.toml"

      - name: Rebuild APK
        run: |
          apktool b apk_unpacked -o rustdesk-unsigned.apk

      - name: Align and Sign APK
        run: |
          zipalign -v -p 4 rustdesk-unsigned.apk rustdesk-aligned.apk
          
          # Generate standard release keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass ashokdesk123 \
            -keypass ashokdesk123 \
            -alias ashokdesk \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ashok Remote, OU=IT, O=AshokTVM, L=Trivandrum, ST=Kerala, C=IN"
          
          # Sign using apksigner with V1, V2, and V3 signing schemes enabled
          apksigner sign \
            --ks release.keystore \
            --ks-pass pass:ashokdesk123 \
            --ks-key-alias ashokdesk \
            --key-pass pass:ashokdesk123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out rustdesk-custom.apk \
            rustdesk-aligned.apk

      - name: Upload Configured APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-arm64
          path: rustdesk-custom.apk
